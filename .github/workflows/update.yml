name: Update swing scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Update market data
        run: python update_data.py

      - name: Save updated data
        run: |
          git config user.name "swing-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
