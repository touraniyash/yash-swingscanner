name: Validate Swing Strategy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run validation backtest
        run: |
          python validation_backtest.py

      - name: Check output files
        run: |
          echo "Created validation files:"
          ls -lh \
            validation_summary.csv \
            validation_train_trades.csv \
            validation_holdout_trades.csv \
            validation_all_trades.csv \
            validation_yearly.csv \
            validation_monthly.csv \
            validation_by_symbol.csv \
            validation_robustness.csv \
            validation_parameters.json \
            validation_failed_symbols.txt \
            VALIDATION_REPORT.txt

          echo
          echo "Validation summary:"
          cat validation_summary.csv

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: swing-strategy-validation
          path: |
            validation_summary.csv
            validation_train_trades.csv
            validation_holdout_trades.csv
            validation_all_trades.csv
            validation_yearly.csv
            validation_monthly.csv
            validation_by_symbol.csv
            validation_robustness.csv
            validation_parameters.json
            validation_failed_symbols.txt
            VALIDATION_REPORT.txt
          if-no-files-found: error

      - name: Show report
        run: |
          echo
          echo "================ VALIDATION REPORT ================"
          cat VALIDATION_REPORT.txt
